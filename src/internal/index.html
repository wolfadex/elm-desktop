<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Hello World!</title>
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <h1>💖 Hello World!</h1>
    <p>Welcome to your Electron application.</p>
    <script src="../elm-frontend.js""></script>
    <script type="module">
      import frontend from "../frontend.js"

      let windowId;

      electronAPI.onInitialize((id) => {
        windowId = id;
      });

      const flags = frontend.flags();
      const app = Elm.Frontend.init({ flags: flags });

      frontend.ports(app);

      electronAPI.onFromBackend(function(msg) {
        app.ports.toFrontend?.send(msg);
      });

      app.ports.sendToBackend?.subscribe(function(msg) {
        electronAPI.sendToBackend([windowId,msg]);
      });

      app.ports.clipboardWriteText?.subscribe(function(text) {
        electronAPI.clipboardWriteText(text);
      });
    </script>
  </body>
</html>
